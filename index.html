<!-- Script used by apt: asks this page to download files, so apt works with no sign-in. -->
<script type="text/plain" id="sh-method">#!/bin/sh
# apt transport "jsfetch": the web page downloads the files for apt.
fail() { printf '400 URI Failure\nURI: %s\nMessage: %s\n\n' "$1" "$2"; }

printf '100 Capabilities\nVersion: 1.2\nSingle-Instance: true\n\n'
n=0
uri=""
fn=""

do_one() {
  n=$((n + 1))
  id="$$.$n"
  path=${uri#jsfetch://}
  rm -f "/data/r.$id" "/data/e.$id"
  printf '102 Status\nURI: %s\nMessage: Downloading through the browser\n\n' "$uri"
  printf '\033]7777;%s;%s\007' "$id" "$path" >&2
  t=0
  while [ ! -e "/data/r.$id" ] && [ ! -e "/data/e.$id" ]; do
    sleep 0.2
    t=$((t + 1))
    if [ "$t" -gt 3000 ]; then break; fi
  done
  if [ -e "/data/r.$id" ]; then
    mkdir -p "$(dirname "$fn")"
    if cp "/data/r.$id" "$fn"; then
      rm -f "/data/r.$id"
      size=$(stat -c %s "$fn")
      md5=$(md5sum "$fn" | cut -d' ' -f1)
      sha256=$(sha256sum "$fn" | cut -d' ' -f1)
      printf '201 URI Done\nURI: %s\nFilename: %s\nSize: %s\nMD5-Hash: %s\nMD5Sum-Hash: %s\nSHA256-Hash: %s\n\n' "$uri" "$fn" "$size" "$md5" "$md5" "$sha256"
    else
      fail "$uri" "could not write $fn"
    fi
  elif [ -e "/data/e.$id" ]; then
    msg=$(cat "/data/e.$id" | tr '\r\n' '  ')
    rm -f "/data/e.$id"
    fail "$uri" "$msg"
  else
    fail "$uri" "timed out waiting for the browser"
  fi
}

while IFS= read -r line; do
  case "$line" in
    "URI: "*) uri=${line#URI: } ;;
    "Filename: "*) fn=${line#Filename: } ;;
    "")
      if [ -n "$uri" ]; then do_one; fi
      uri=""
      fn=""
      ;;
  esac
done
</script>

<!-- Shell startup file: apt setup, console banner, reboot/poweroff commands. -->
<script type="text/plain" id="sh-setup">#!/bin/bash
# Prepares the system before the console opens. Runs as root on every start.
[ -r /etc/os-release ] && . /etc/os-release

codename=${VERSION_CODENAME:-}
if [ -z "$codename" ]; then
  case "${VERSION_ID:-}" in
    8) codename=jessie ;;
    9) codename=stretch ;;
    10) codename=buster ;;
    11) codename=bullseye ;;
    *) codename=bookworm ;;
  esac
fi

mkdir -p /usr/lib/apt/methods /etc/apt/apt.conf.d /etc/apt/sources.list.d /etc/dpkg/dpkg.cfg.d /usr/local/sbin /usr/local/bin

# --- apt: download through the web page ---------------------------------
if [ -r /data/jsfetch ]; then
  cp /data/jsfetch /usr/lib/apt/methods/jsfetch && chmod 755 /usr/lib/apt/methods/jsfetch
fi
printf '%s\n' \
  'APT::Sandbox::User "root";' \
  'Acquire::Languages "none";' \
  'Acquire::PDiffs "false";' \
  'Acquire::Retries "0";' \
  'Acquire::Check-Valid-Until "false";' \
  'Acquire::AllowReleaseInfoChange "true";' > /etc/apt/apt.conf.d/99browser
printf '%s\n' \
  'path-exclude=/usr/share/doc/*' \
  'path-include=/usr/share/doc/*/copyright' \
  'path-exclude=/usr/share/locale/*' \
  'path-exclude=/usr/share/info/*' > /etc/dpkg/dpkg.cfg.d/01-browser

if [ ! -e /etc/apt/sources.list.orig ] && [ -e /etc/apt/sources.list ]; then
  cp /etc/apt/sources.list /etc/apt/sources.list.orig
fi
for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
  [ -e "$f" ] || continue
  [ "$f" = /etc/apt/sources.list.d/browser-local.list ] && continue
  mv "$f" "$f.disabled"
done
case "$codename" in
  jessie|stretch|buster)
    # Old releases live on the archive server.
    {
      echo "deb jsfetch://archive.debian.org/debian $codename main"
      echo "deb jsfetch://archive.debian.org/debian-security $codename/updates main"
    } > /etc/apt/sources.list ;;
  sid|unstable|testing)
    echo "deb jsfetch://deb.debian.org/debian $codename main" > /etc/apt/sources.list ;;
  *)
    {
      echo "deb jsfetch://deb.debian.org/debian $codename main"
      echo "deb jsfetch://deb.debian.org/debian-security $codename-security main"
    } > /etc/apt/sources.list ;;
esac
if [ -e /data/local-mirror ]; then
  echo 'deb [trusted=yes] jsfetch://local/repo ./' > /etc/apt/sources.list.d/browser-local.list
else
  rm -f /etc/apt/sources.list.d/browser-local.list
fi

# --- host name ------------------------------------------------------------
echo debian > /etc/hostname 2>/dev/null
grep -qw debian /etc/hosts 2>/dev/null || echo '127.0.0.1 debian' >> /etc/hosts 2>/dev/null
hostname debian 2>/dev/null
h=$(hostname 2>/dev/null)
if [ -z "$h" ] || [ "$h" = "(none)" ]; then
  # The engine cannot set a host name, so make the prompt say it anyway.
  if ! grep -q browser-ps1 /root/.bashrc 2>/dev/null; then
    cat >> /root/.bashrc <<'RC'
# browser-ps1
PS1='\u@debian:\w\$ '
RC
  fi
fi

# --- power commands: reboot/poweroff talk to the web page ------------------
for c in reboot poweroff halt shutdown; do
  kind=poweroff
  [ "$c" = reboot ] && kind=reboot
  printf '#!/bin/sh\nprintf "\\033]7777;sys;%s\\007" >&2\nsleep 30\n' "$kind" > "/usr/local/sbin/$c"
  chmod 755 "/usr/local/sbin/$c"
done

# --- first start: starter packages from the built-in mirror ----------------
if [ -e /data/local-mirror ] && [ ! -e /var/lib/browser-setup.done ]; then
  echo "Setting up the system (first start only, this takes a few minutes)..."
  o="-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/browser-local.list -o Dir::Etc::sourceparts=-"
  if apt-get $o update; then
    avail=""
    for p in sudo nano tmux htop tree less unzip zip jq neofetch file ncdu bc sqlite3 mc figlet cowsay fortune-mod fortunes-min sl cmatrix curl wget git ca-certificates; do
      apt-cache $o show "$p" >/dev/null 2>&1 && avail="$avail $p"
    done
    DEBIAN_FRONTEND=noninteractive apt-get $o install -y --no-install-recommends $avail
  fi
  : > /var/lib/browser-setup.done
fi

# --- package lists, when the page can reach the Debian archive -------------
case "$(cat /data/net-route 2>/dev/null)" in
  direct|proxy)
    if [ ! -e /var/lib/browser-update.done ]; then
      echo "Updating package lists..."
      apt-get update && : > /var/lib/browser-update.done
    fi ;;
esac

# --- sudo: only needed as a stand-in when the real one is not installed ----
if [ -x /usr/bin/sudo ]; then
  rm -f /usr/local/bin/sudo
elif [ ! -e /usr/local/bin/sudo ]; then
  cat > /usr/local/bin/sudo <<'SUDO'
#!/bin/sh
while [ $# -gt 0 ]; do
  case "$1" in -*) shift ;; *) break ;; esac
done
if [ $# -eq 0 ]; then exec bash; else exec "$@"; fi
SUDO
  chmod 755 /usr/local/bin/sudo
fi
exit 0
</script>

<script type="text/plain" id="sh-banner">#!/bin/bash
# What a Debian text console prints at login.
[ -r /etc/os-release ] && . /etc/os-release
printf '\n'
if [ -r /etc/issue ]; then
  sed -e 's/\\n/debian/g' -e 's/\\l/tty1/g' -e 's/\\.//g' /etc/issue
else
  printf '%s %s debian tty1\n\n' "${NAME:-Debian GNU/Linux}" "${VERSION_ID:-}"
fi
printf 'debian login: root (automatic login)\n\n'
if [ -r /var/lib/browser-lastlogin ]; then
  printf 'Last login: %s on tty1\n' "$(cat /var/lib/browser-lastlogin)"
fi
date '+%a %b %e %H:%M:%S %Z %Y' > /var/lib/browser-lastlogin 2>/dev/null
printf 'Linux debian %s %s %s\n' "$(uname -r)" "$(uname -v)" "$(uname -m)"
[ -r /etc/motd ] && cat /etc/motd
exit 0
</script>

/* ------------------------------------------------------------ terminal */
if (typeof Terminal === "undefined" || typeof FitAddon === "undefined") {
  $("screen").innerHTML = '<div id="fallback" style="color:#f55">[FAILED] Terminal library missing from the page. Re-upload the complete index.html.</div>';
  throw new Error("xterm.js failed to load");
}

try { await document.fonts.load('16px "Web IBM VGA 8x16"'); } catch (_) {}
// The font is an 8x16 bitmap: whole multiples of 16px stay perfectly sharp.
const scale = Math.max(1, Math.min(4, Math.round(Number(params.get("size")) || Number(localStorage.getItem("fontscale")) || (innerWidth >= 1500 ? 2 : 1))));
if (params.get("size")) localStorage.setItem("fontscale", String(scale));

const term = new Terminal({
  convertEol: true,
  cursorBlink: true,
  cursorStyle: "underline", // the Linux text console draws an underline cursor
  scrollback: 5000,
  fontSize: 16 * scale,
  lineHeight: 1,
  letterSpacing: 0,
  fontFamily: '"Web IBM VGA 8x16", "DejaVu Sans Mono", Menlo, Consolas, monospace',
  theme: {
    background: "#000000", foreground: "#aaaaaa", cursor: "#aaaaaa", cursorAccent: "#000000",
    selectionBackground: "#555555",
    black: "#000000", red: "#aa0000", green: "#00aa00", yellow: "#aa5500",
    blue: "#0000aa", magenta: "#aa00aa", cyan: "#00aaaa", white: "#aaaaaa",
    brightBlack: "#555555", brightRed: "#ff5555", brightGreen: "#55ff55", brightYellow: "#ffff55",
    brightBlue: "#5555ff", brightMagenta: "#ff55ff", brightCyan: "#55ffff", brightWhite: "#ffffff",
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($("screen"));
const refit = () => { try { fit.fit(); } catch (_) {} };
refit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
addEventListener("click", () => term.focus());
term.focus();

let ctrlOn = false;
const ctrlBtn = $("ctrl");
let onInput = () => {};
term.onData((d) => {
  if (ctrlOn && d.length === 1) {
    const c = d.toLowerCase().charCodeAt(0);
    if (c >= 97 && c <= 122) d = String.fromCharCode(c - 96);
    ctrlOn = false; ctrlBtn.classList.remove("on");
  }
  onInput(d);
});
term.attachCustomKeyEventHandler((e) => {
  if (e.type === "keydown" && e.ctrlKey && e.altKey && e.key === "Delete") { location.reload(); return false; }
  return true;
});
document.querySelectorAll("#keys button").forEach((b) => {
  b.addEventListener("pointerdown", (e) => e.preventDefault());
  b.addEventListener("click", () => {
    if (b.dataset.ctrl) { ctrlOn = !ctrlOn; b.classList.toggle("on", ctrlOn); }
    else onInput(JSON.parse('"' + b.dataset.k.replace(/"/g, '\\"') + '"'));
    term.focus();
  });
});

/* ---------------------------------- loading screen (cleared before login) */
const OK = "[\x1b[0;32m  OK  \x1b[0m]";
const BAD = "[\x1b[0;31mFAILED\x1b[0m]";
async function step(text, fn) {
  term.write(`[\x1b[1;33m ...  \x1b[0m] ${text}`);
  try {
    const r = await fn();
    term.write(`\r\x1b[K${OK} ${text}\r\n`);
    return r;
  } catch (e) {
    term.write(`\r\x1b[K${BAD} ${text}\r\n`);
    throw e;
  }
}
function notes(lines) { for (const l of lines) term.write("         " + l + "\r\n"); }
function stop(title, lines, reboot = true) {
  term.write(`${BAD} ${title}\r\n`);
  notes(lines);
  if (reboot) {
    term.write("\r\n         Press any key to try again.\r\n");
    onInput = () => location.reload();
  }
}
const clearScreen = () => term.write("\x1b[3J\x1b[2J\x1b[H");

/* ------------------------------------------------------------- preflight */
async function eraseDisk() {
  await new Promise((res) => {
    const r = indexedDB.deleteDatabase(IDB_NAME);
    r.onsuccess = r.onerror = r.onblocked = () => res();
    setTimeout(res, 2500);
  });
}

async function main() {
  if (params.has("reset")) {
    await step("Erasing the virtual disk", eraseDisk);
    history.replaceState(null, "", location.pathname + location.search);
  }

  if (location.protocol === "file:") {
    return stop("This page must be served over http(s), not opened from a file", [
      "Browsers disable the features Linux needs on file:// pages.",
      "Upload index.html and coi-serviceworker.js to any static host",
      "(GitHub Pages, Netlify, Cloudflare Pages), or run in this folder:",
      "    python3 -m http.server",
      "and open http://localhost:8000",
    ], false);
  }
  if (!window.isSecureContext) {
    return stop("A secure connection is required", ["Open this page over https:// (or http://localhost)."], false);
  }
  if (!crossOriginIsolated) {
    if (!("serviceWorker" in navigator)) {
      return stop("This browser cannot run the system", ["Use a recent Chrome, Edge or Firefox."], false);
    }
    if (sessionStorage.getItem("coi-tried")) {
      return stop("Could not prepare the browser", [
        "Make sure coi-serviceworker.js is next to index.html,",
        "that service workers are allowed, and that this is not a private window.",
      ]);
    }
    try {
      await step("Preparing the browser", async () => {
        const reg = await navigator.serviceWorker.register("coi-serviceworker.js");
        sessionStorage.setItem("coi-tried", "1");
        await new Promise((res) => {
          if (reg.active && !navigator.serviceWorker.controller) return res();
          navigator.serviceWorker.addEventListener("controllerchange", res, { once: true });
          setTimeout(res, 3000);
        });
      });
    } catch (e) {
      return stop("Could not prepare the browser", [String(e && e.message || e)]);
    }
    location.reload();
    return;
  }
  sessionStorage.removeItem("coi-tried");

  /* --------------------------------------------------------------- boot */
  let CheerpX;
  await step("Loading the x86 virtualization engine", async () => {
    const mod = await import(CX_URL);
    CheerpX = mod.CheerpX || mod.default || mod;
    if (!CheerpX.Linux) throw new Error("engine has no Linux API");
  });

  let cloud, idb, overlay, data;
  await step("Connecting to the root filesystem", async () => {
    cloud = await CheerpX.CloudDevice.create(DISK_URL);
  });
  await step("Mounting persistent storage", async () => {
    idb = await CheerpX.IDBDevice.create(IDB_NAME);
    overlay = await CheerpX.OverlayDevice.create(cloud, idb);
    data = await CheerpX.DataDevice.create();
  });

  const networkInterface = AUTHKEY ? {
    authKey: AUTHKEY,
    controlUrl: CONTROL || undefined,
    stateUpdateCb: () => {},
    netmapUpdateCb: () => {},
  } : null;

  let cx;
  await step("Starting the Linux system", async () => {
    const cfg = {
      mounts: [
        { type: "ext2", path: "/", dev: overlay },
        { type: "dir", path: "/data", dev: data },
        { type: "devs", path: "/dev" },
        { type: "devpts", path: "/dev/pts" },
        { type: "proc", path: "/proc" },
      ],
    };
    if (networkInterface) cfg.networkInterface = networkInterface;
    cx = await CheerpX.Linux.create(cfg);
  });

  if (networkInterface) {
    try { await step("Joining the Tailscale network", async () => { await cx.networkLogin(); }); }
    catch (_) { /* carry on without real networking */ }
  }

  await step("Preparing the system", async () => {
    await data.writeFile("/jsfetch", $("sh-method").textContent);
    await data.writeFile("/setup.sh", $("sh-setup").textContent);
    await data.writeFile("/banner.sh", $("sh-banner").textContent);
    try {
      const r = await fetch("repo/Release", { method: "HEAD", cache: "no-cache" });
      if (r.ok) await data.writeFile("/local-mirror", "1");
    } catch (_) {}
  });

  /* ---------------------- bridge: the shell asks the page for downloads */
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  let preferred = "direct";

  async function download(path) {
    if (path.startsWith("local/")) {
      // Packages published next to this page (same origin, so no CORS problem).
      const res = await fetch(path.slice(6), { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      return new Uint8Array(await res.arrayBuffer());
    }
    const target = "https://" + path;
    const routes = [{ name: "direct", url: target }];
    if (PROXY) routes.push({ name: "proxy", url: PROXY + "?url=" + encodeURIComponent(target) });
    if (preferred === "proxy") routes.reverse();
    for (const r of routes) {
      let res;
      try { res = await fetch(r.url, { credentials: "omit" }); }
      catch (_) { continue; } // blocked by CORS or offline: try the next route
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      const bytes = new Uint8Array(await res.arrayBuffer());
      preferred = r.name;
      return bytes;
    }
    throw new Error(PROXY
      ? "download failed (offline, or blocked by the server)"
      : "the Debian server blocks downloads from web pages. Deploy worker.js and open this page once with #proxy=YOUR_WORKER_URL");
  }

  async function handleRequest(payload) {
    const i = payload.indexOf(";");
    const id = payload.slice(0, i), arg = payload.slice(i + 1);
    if (id === "sys") {
      if (arg === "reboot") location.reload();
      else if (arg === "poweroff") {
        term.write("\r\nSystem halted.\r\n");
        onInput = () => {};
      }
      return;
    }
    try {
      const bytes = await download(arg);
      await data.writeFile("/r." + id, bytes);
    } catch (e) {
      await data.writeFile("/e." + id, String(e && e.message || e));
    }
  }

  // Strip our private escape sequence out of the output stream.
  const START = "\x1b]7777;";
  let pending = "";
  function filter(chunk) {
    const s = pending + chunk;
    pending = "";
    let out = "", i = 0;
    for (;;) {
      const a = s.indexOf(START, i);
      if (a < 0) {
        let keep = 0;
        for (let k = Math.min(START.length - 1, s.length - i); k > 0; k--) {
          if (START.startsWith(s.slice(s.length - k))) { keep = k; break; }
        }
        out += s.slice(i, s.length - keep);
        pending = s.slice(s.length - keep);
        return out;
      }
      out += s.slice(i, a);
      const b = s.indexOf("\x07", a);
      if (b < 0) { pending = s.slice(a); return out; }
      handleRequest(s.slice(a + START.length, b));
      i = b + 1;
    }
  }

  // Can this page download from the Debian archive (directly or via the proxy)?
  let route = "none";
  try { await download("archive.debian.org/debian/dists/buster/Release"); route = preferred; } catch (_) {}
  try { await data.writeFile("/net-route", route); } catch (_) {}

  /* -------------------------------------------------------- hand over */
  term.write("\r\n");
  const send = cx.setCustomConsole(
    (buf) => { term.write(filter(dec.decode(buf, { stream: true }))); },
    term.cols,
    term.rows
  );
  onInput = (str) => { for (const b of enc.encode(str)) send(b); };
  term.focus();

  const env = [
    "HOME=/root", "USER=root", "LOGNAME=root", "SHELL=/bin/bash",
    "TERM=xterm-256color", "LANG=C.UTF-8",
    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    "COLUMNS=" + term.cols, "LINES=" + term.rows,
  ];
  const opts = { env, cwd: "/root", uid: 0, gid: 0 };

  try {
    // System setup (first start installs the starter packages). Hidden once finished.
    await cx.run("/bin/bash", ["/data/setup.sh"], opts);
    clearScreen();
    await cx.run("/bin/bash", ["/data/banner.sh"], opts);
    for (;;) {
      await cx.run("/bin/bash", ["--login"], opts);
      term.write("\r\n");
      await cx.run("/bin/bash", ["/data/banner.sh"], opts);
    }
  } catch (e) {
    console.error(e);
    stop("The system stopped unexpectedly", [String(e && e.message || e)]);
  }
}

main().catch((e) => {
  console.error(e);
  stop("The system could not start", [String(e && e.message || e)]);
});
</script>
</body>
</html>
